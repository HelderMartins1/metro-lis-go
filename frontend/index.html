<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cais</title>
    <meta name="description" content="Tempos de espera do metro de Lisboa, estação a estação. App não oficial." />
    <meta name="theme-color" content="#f6f6f3" />
    <script>
      // Apply the saved theme before the first paint, so the page never flashes the wrong one.
      (function () {
        var choice = 'auto';
        try {
          choice = JSON.parse(localStorage.getItem('cais:theme')) || 'auto';
        } catch (e) {}
        var dark = choice === 'dark' || (choice === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name=theme-color]').content = dark ? '#101113' : '#f6f6f3';
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cais" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
