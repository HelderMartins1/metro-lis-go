# nginx for Cais: the frontend at caislx.tech, the API at api.caislx.tech.
# Copy to /etc/nginx/sites-available/caislx.tech and link it into sites-enabled.
# certbot --nginx adds the HTTPS (listen 443) parts and the http -> https redirects.

# www.caislx.tech -> caislx.tech
server {
    listen 80;
    listen [::]:80;
    server_name www.caislx.tech;
    return 301 https://caislx.tech$request_uri;
}

# The frontend: static files the deploy puts in /var/www/cais/www.
server {
    listen 80;
    listen [::]:80;
    server_name caislx.tech;

    root /var/www/cais/www;
    index index.html;

    # add_header inside a location replaces the ones here, so each location repeats them.
    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Vite puts a content hash in these names: cache them for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # The service worker and the page must always be checked, or updates never arrive.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}

# The API: the Go server (systemd unit "cais") on port 8081.
server {
    listen 80;
    listen [::]:80;
    server_name api.caislx.tech;

    client_max_body_size 32k;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Line positions ask every station of a line; give them time.
        proxy_read_timeout 30s;
    }
}
